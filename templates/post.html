{% extends 'base.html' %}

{% block content%}

     <h1> Snake </h1>

     <nav class="navbar">
        <ul>
            <li><a href="Home">Home</a></li>
            <li><a href="Signup">Sign Up</a></li>
        </ul>
    </nav>

    <main>
        <h2>post here? maybe?</h2>
    </main>

    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <!-- iterate through the results -->
        {% for item in results%} 
        <div class="item">
            <img src="{{url_for('static',filename='images/'+item[2])}}" alt="{{item[1]}}">
            <p>{{item[1]}}</p>
        </div>
        <!-- must have an "endfor"! dont forget -->
        {% endfor %}
    </div>
        

    <!-- Now make a form to input a new item- For Uploads- the enctype must be set like this! -->
    <form action="/add_item" method="post" enctype='multipart/form-data'>
        <label for="snake_type">snake type</label>
        <input type="text" name="snake_type">
        <!-- file input type- the 'accept' helps to remind user to upload images but should still be checked on server -->
        <input type="file" name="file">
        <input type="submit" value="Add">
    </form>
</body>
</html>
{% endblock %}
